resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name dockcampus.sudelca.com;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/app/(.*)$ {
        set $backend_url http://backend:8000;
        proxy_pass $backend_url/containers/app/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api {
        set $backend_url http://container-engine:8001;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /docs {
        set $backend_url http://container-engine:8001;
        proxy_pass $backend_url/docs;
        proxy_http_version 1.1;
    }

    location /openapi.json {
        set $backend_url http://container-engine:8001;
        proxy_pass $backend_url/openapi.json;
        proxy_http_version 1.1;
    }

    location /monitor {
        set $engine_url http://container-engine:8001;
        proxy_pass $engine_url/monitor;
        proxy_http_version 1.1;
    }

    location / {
        set $frontend_url http://frontend:3000;
        proxy_pass $frontend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
