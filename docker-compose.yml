services:
  db:
    image: postgres:16
    container_name: dockcampus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockcampus
      POSTGRES_PASSWORD: changeme123
      POSTGRES_DB: dockcampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
