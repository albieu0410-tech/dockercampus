services:
  db:
    image: postgres:16
    container_name: dockcampus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockcampus
      POSTGRES_PASSWORD: j303871992
      POSTGRES_DB: dockcampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"

  container-engine:
    build: ./container-engine
    container_name: dockcampus-container-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dockcampus:j303871992@db:5432/dockcampus
      RUST_LOG: container_engine=debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: dockcampus-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dockcampus:j303871992@db:5432/dockcampus
      RUST_SERVICE_URL: http://container-engine:8001
      SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      - db
      - container-engine

  frontend:
    build: ./frontend
    container_name: dockcampus-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://dockcampus.sudelca.com
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
