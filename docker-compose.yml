services:
  nginx:
    image: nginx:alpine
    container_name: dockcampus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:16
    container_name: dockcampus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockcampus
      POSTGRES_PASSWORD: j303871992
      POSTGRES_DB: dockcampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"

  container-engine:
    build: ./container-engine
    container_name: dockcampus-container-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dockcampus:j303871992@db:5432/dockcampus
      RUST_LOG: container_engine=debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: dockcampus-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dockcampus:j303871992@db:5432/dockcampus
      JWT_SECRET: j303871992
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      CONTAINER_ENGINE_URL: http://container-engine:8001
      PROFESSOR_EMAIL: humera.noor@gmail.com
      PROFESSOR_PASSWORD: Pr0fess0r@2026!
    ports:
      - "8000:8000"
    depends_on:
      - db
      - container-engine

  frontend:
    build: ./frontend
    container_name: dockcampus-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.sudelca.com
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
